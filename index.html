    function timeToDec(timeStr) {
      if (!timeStr || typeof timeStr !== 'string') return 7.0;
      const [h, m] = timeStr.split(':').map(Number);
      return (isNaN(h) ? 7 : h) + (isNaN(m) ? 0 : m) / 60;
    }

    function decToTime(dec) {
      const h = Math.floor(dec);
      const m = Math.round((dec - h) * 60);
      return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
    }

    function slotsOverlap(s1, s2) {
      if (!s1 || !s2 || s1.day !== s2.day) return false;
      const start1 = timeToDec(s1.start);
      const end1 = timeToDec(s1.end);
      const start2 = timeToDec(s2.start);
      const end2 = timeToDec(s2.end);
      return Math.max(start1, start2) < Math.min(end1, end2);
    }

    function checkConflict(candidateSlots, placedItems) {
      for (const item of placedItems) {
        if (item.isVirtual) continue;
        for (const slot1 of candidateSlots) {
          for (const slot2 of item.schedule) {
            if (slotsOverlap(slot1, slot2)) {
              return true;
            }
          }
        }
      }
      return false;
    }

        setCourseOffer(prev => ({
          ...prev,
          [courseId]: createDefaultOfferForMode(newMode)
        }));
      };

      const handleCreateCustomCourse = (e) => {
        e.preventDefault();
        const codeTrim = newCourseCode.trim().toUpperCase();
        const nameTrim = newCourseName.trim();
        if (!codeTrim || !nameTrim) return;

        if (allAvailableCourses.some(c => c.id === codeTrim)) {
          alert('Ya existe una materia con ese código.');
          return;
        }

        const newCourse = { id: codeTrim, name: nameTrim, defaultMode: newCourseMode, isCustom: true };
        setCustomCourses(prev => [...prev, newCourse]);
        setSelectedCourses(prev => [...prev, { id: codeTrim, name: nameTrim, mode: newCourseMode }]);
        setCourseOffer(prev => ({
          ...prev,
          [codeTrim]: createDefaultOfferForMode(newCourseMode)
        }));

        setNewCourseCode('');
        setNewCourseName('');
        setShowNewCourseModal(false);
      };

      // Operaciones Estándar
      const addStandardSection = (courseId) => {
        const offer = courseOffer[courseId] || createDefaultOfferForMode('standard');
        const sections = offer.sections || [];
        const nextNum = sections.length + 1;
        setCourseOffer(prev => ({
          ...prev,
          [courseId]: {
            ...offer,
            sections: [
              ...sections,
              {
                nrc: '',
                sectionName: `Sec ${nextNum}`,
                prof: '',
                schedule: [{ day: 'MAR', start: '09:00', end: '11:00' }]
              }
            ]
          }
        }));
      };

      const removeStandardSection = (courseId, secIdx) => {
        const offer = courseOffer[courseId];
        const sections = (offer.sections || []).filter((_, idx) => idx !== secIdx);
        setCourseOffer(prev => ({ ...prev, [courseId]: { ...offer, sections } }));
      };

      const updateStandardSectionField = (courseId, secIdx, field, value) => {
        const offer = { ...courseOffer[courseId] };
        offer.sections[secIdx][field] = value;
        setCourseOffer(prev => ({ ...prev, [courseId]: offer }));
      };

      const addStandardSlot = (courseId, secIdx) => {
        const offer = { ...courseOffer[courseId] };
        offer.sections[secIdx].schedule.push({ day: 'MIE', start: '07:00', end: '09:00' });
        setCourseOffer(prev => ({ ...prev, [courseId]: offer }));
      };

      const removeStandardSlot = (courseId, secIdx, slotIdx) => {
        const offer = { ...courseOffer[courseId] };
        if (offer.sections[secIdx].schedule.length <= 1) return;
        offer.sections[secIdx].schedule = offer.sections[secIdx].schedule.filter((_, idx) => idx !== slotIdx);
        setCourseOffer(prev => ({ ...prev, [courseId]: offer }));
      };

      const updateStandardSlot = (courseId, secIdx, slotIdx, field, value) => {
        const offer = { ...courseOffer[courseId] };
        offer.sections[secIdx].schedule[slotIdx][field] = value;
        setCourseOffer(prev => ({ ...prev, [courseId]: offer }));
      };

      // Operaciones Teoría + Práctica
      const addTheoryGroup = (courseId) => {
        const offer = courseOffer[courseId] || createDefaultOfferForMode('theory_practice');
        const groups = offer.theoryGroups || [];
        const nextNum = groups.length + 1;
        setCourseOffer(prev => ({
          ...prev,
          [courseId]: {
            ...offer,
            theoryGroups: [
              ...groups,
              {
                id: 'tg-' + Date.now(),
                theoryNrc: '',
                theorySectionName: `Teoría ${nextNum}`,
                theoryProf: '',
                theorySchedule: [{ day: 'MAR', start: '09:00', end: '11:00' }],
                practices: [
                  {
                    id: 'p-' + Date.now(),
                    practiceNrc: '',
                    practiceSectionName: 'Práctica 1',
                    practiceProf: '',
                    practiceSchedule: [{ day: 'JUE', start: '09:00', end: '11:00' }]
                  }
                ]
              }
            ]
          }
        }));
      };

      const removeTheoryGroup = (courseId, tgIdx) => {
        const offer = courseOffer[courseId];
        const groups = (offer.theoryGroups || []).filter((_, idx) => idx !== tgIdx);
        setCourseOffer(prev => ({ ...prev, [courseId]: { ...offer, theoryGroups: groups } }));
      };

      const updateTheoryField = (courseId, tgIdx, field, value) => {
        const offer = { ...courseOffer[courseId] };
        offer.theoryGroups[tgIdx][field] = value;
        setCourseOffer(prev => ({ ...prev, [courseId]: offer }));
      };

      const addPracticeToTheory = (courseId, tgIdx) => {
        const offer = { ...courseOffer[courseId] };
        const tg = offer.theoryGroups[tgIdx];
        const nextNum = tg.practices.length + 1;
        tg.practices.push({
          id: 'p-' + Date.now(),
          practiceNrc: '',
          practiceSectionName: `Práctica ${nextNum}`,
          practiceProf: '',
          practiceSchedule: [{ day: 'VIE', start: '07:00', end: '09:00' }]
        });
        setCourseOffer(prev => ({ ...prev, [courseId]: offer }));
      };

      const removePracticeFromTheory = (courseId, tgIdx, pIdx) => {
        const offer = { ...courseOffer[courseId] };
        if (offer.theoryGroups[tgIdx].practices.length <= 1) return;
        offer.theoryGroups[tgIdx].practices = offer.theoryGroups[tgIdx].practices.filter((_, idx) => idx !== pIdx);
        setCourseOffer(prev => ({ ...prev, [courseId]: offer }));
      };

      const updatePracticeField = (courseId, tgIdx, pIdx, field, value) => {
        const offer = { ...courseOffer[courseId] };
        offer.theoryGroups[tgIdx].practices[pIdx][field] = value;
        setCourseOffer(prev => ({ ...prev, [courseId]: offer }));
      };

      // Operaciones Virtuales
      const addVirtualSection = (courseId) => {
        const offer = courseOffer[courseId] || createDefaultOfferForMode('virtual');
        const list = offer.virtualSections || [];
        const nextNum = list.length + 1;
        setCourseOffer(prev => ({
          ...prev,
          [courseId]: {
            ...offer,
            virtualSections: [
              ...list,
              { nrc: '', sectionName: `Sec V${nextNum}`, prof: '' }
            ]
          }
        }));
      };

      const removeVirtualSection = (courseId, vIdx) => {
        const offer = courseOffer[courseId];
        const list = (offer.virtualSections || []).filter((_, idx) => idx !== vIdx);
        setCourseOffer(prev => ({ ...prev, [courseId]: { ...offer, virtualSections: list } }));
      };

      const updateVirtualSection = (courseId, vIdx, field, value) => {
        const offer = { ...courseOffer[courseId] };
        offer.virtualSections[vIdx][field] = value;
        setCourseOffer(prev => ({ ...prev, [courseId]: offer }));
      };

      const resetAllData = () => {
        if (confirm(`¿Deseas limpiar todas las materias y NRCs cargados para ${currentCareer.name}?`)) {
          setSelectedCourses([]);
          setCourseOffer({});
          setCustomCourses([]);
          setCurrentIndex(0);
          localStorage.removeItem(`horarios_courses_${activeCareerId}_v7`);
          localStorage.removeItem(`horarios_offer_${activeCareerId}_v7`);
          localStorage.removeItem(`horarios_custom_${activeCareerId}_v7`);
          localStorage.removeItem(`horarios_courses_${activeCareerId}_v6`);
          localStorage.removeItem(`horarios_offer_${activeCareerId}_v6`);
          localStorage.removeItem(`horarios_custom_${activeCareerId}_v6`);
          setActiveTab('courses');
        }
      };

      const exportScheduleImage = () => {
        const element = document.getElementById('schedule-calendar-capture');
        if (!element || typeof html2canvas === 'undefined') {
          window.print();
          return;
        }
        setIsExportingImage(true);
        html2canvas(element, {
          backgroundColor: '#0b0f19',
          scale: 2,
          useCORS: true,
          logging: false,
          scrollX: 0,
          scrollY: 0
        }).then(canvas => {
          const link = document.createElement('a');
          const careerTag = currentCareer ? currentCareer.shortName : 'UCAB';
          link.download = `Horario_${careerTag}_Opcion_${currentIndex + 1}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          setIsExportingImage(false);
        }).catch(err => {
          console.error(err);
          setIsExportingImage(false);
          window.print();
        });
      };

      // Backtracking
      const calculationResult = useMemo(() => {
        if (selectedCourses.length === 0) {
          return { combinations: [], missingCourses: [] };
        }

        const missing = [];
        const activeCourseOptions = [];

        selectedCourses.forEach((c, idx) => {
          const offer = courseOffer[c.id] || { mode: c.mode || 'standard' };
          const mode = offer.mode || c.mode || 'standard';
          const color = PALETTES[idx % PALETTES.length];
          const courseBase = { courseId: c.id, courseName: c.name, color, mode };

          if (mode === 'virtual') {
            const sections = (offer.virtualSections || []).filter(s => s.nrc && s.nrc.trim() !== '');
            if (sections.length === 0) {
              missing.push({ ...c, reason: 'Falta ingresar NRC virtual' });
            } else {
              const options = sections.map(sec => ({
                ...courseBase,
                type: 'virtual',
                nrc: sec.nrc,
                sectionName: sec.sectionName,
                prof: sec.prof,
                isVirtual: true,
                schedule: []
              }));
              activeCourseOptions.push({ course: c, options });
            }
          } else if (mode === 'theory_practice') {
            const groups = offer.theoryGroups || [];
            const validOptions = [];

            groups.forEach(tg => {
              if (!tg.theoryNrc || tg.theoryNrc.trim() === '') return;
              (tg.practices || []).forEach(pr => {
                if (!pr.practiceNrc || pr.practiceNrc.trim() === '') return;

                let selfConflict = false;
                for (const tSlot of tg.theorySchedule) {
                  for (const pSlot of pr.practiceSchedule) {
                    if (slotsOverlap(tSlot, pSlot)) {
                      selfConflict = true;
                      break;
                    }
                  }
                  if (selfConflict) break;
                }

                if (!selfConflict) {
                  validOptions.push({
                    ...courseBase,
                    type: 'theory_practice',
                    theoryNrc: tg.theoryNrc,
                    theorySectionName: tg.theorySectionName,
                    theoryProf: tg.theoryProf,
                    theorySchedule: tg.theorySchedule,
                    practiceNrc: pr.practiceNrc,
                    practiceSectionName: pr.practiceSectionName,
                    practiceProf: pr.practiceProf,
                    practiceSchedule: pr.practiceSchedule,
                    schedule: [...tg.theorySchedule, ...pr.practiceSchedule]
                  });
                }
              });
            });

            if (validOptions.length === 0) {
              missing.push({ ...c, reason: 'Falta ingresar NRC de Teoría o Práctica' });
            } else {
              activeCourseOptions.push({ course: c, options: validOptions });
            }
          } else {
            const sections = (offer.sections || []).filter(s => s.nrc && s.nrc.trim() !== '' && s.schedule && s.schedule.length > 0);
            if (sections.length === 0) {
              missing.push({ ...c, reason: 'Falta ingresar NRC y horario' });
            } else {
              const options = sections.map(sec => ({
                ...courseBase,
                type: 'standard',
                nrc: sec.nrc,
                sectionName: sec.sectionName,
                prof: sec.prof,
                schedule: sec.schedule
              }));
              activeCourseOptions.push({ course: c, options });
            }
          }
        });

        if (missing.length > 0) {
          return { combinations: [], missingCourses: missing };
        }

        const rawCombinations = [];

        function backtrack(idx, currentPlaced) {
          if (idx === activeCourseOptions.length) {
            rawCombinations.push([...currentPlaced]);
            return;
          }

          const { options } = activeCourseOptions[idx];
          for (const opt of options) {
            if (opt.isVirtual || !checkConflict(opt.schedule, currentPlaced)) {
              currentPlaced.push(opt);
              backtrack(idx + 1, currentPlaced);
              currentPlaced.pop();
            }
          }
        }

        backtrack(0, []);

        // Asignación secuencial de materias virtuales en Domingo con horas redondas
        const SUNDAY_ROUND_SLOTS = [
          { start: '07:00', end: '09:00' },
          { start: '09:00', end: '11:00' },
          { start: '11:00', end: '13:00' },
          { start: '13:00', end: '15:00' },
          { start: '15:00', end: '17:00' },
          { start: '17:00', end: '19:00' }
        ];

        const processedCombinations = rawCombinations.map(comb => {
          let virtualIdx = 0;
          return comb.map(item => {
            if (item.isVirtual) {
              const slotTime = SUNDAY_ROUND_SLOTS[virtualIdx % SUNDAY_ROUND_SLOTS.length];
              virtualIdx++;
              return {
                ...item,
                schedule: [
                  { day: 'DOM', start: slotTime.start, end: slotTime.end, isVirtual: true }
                ]
              };
            }
            return item;
          });
        });

        return { combinations: processedCombinations, missingCourses: [] };
      }, [selectedCourses, courseOffer]);

      const combinations = calculationResult.combinations;
      const missingCourses = calculationResult.missingCourses;

      useEffect(() => {
        if (currentIndex >= combinations.length) {
          setCurrentIndex(0);
        }
      }, [combinations.length, currentIndex]);

      const currentCombination = combinations[currentIndex] || [];

      const copyNrcList = () => {
        if (!currentCombination.length) return;

        const detailLines = [];
        const pureNrcs = [];

        currentCombination.forEach(item => {
          if (item.type === 'theory_practice') {
            detailLines.push(`• ${item.courseName} [${item.courseId}]: Teoría NRC ${item.theoryNrc} (${item.theorySectionName}), Práctica NRC ${item.practiceNrc} (${item.practiceSectionName})`);
            pureNrcs.push(item.theoryNrc, item.practiceNrc);
          } else if (item.type === 'virtual') {
            detailLines.push(`• ${item.courseName} [${item.courseId}]: NRC ${item.nrc} (${item.sectionName} - Virtual Asíncrona)`);
            pureNrcs.push(item.nrc);
          } else {
            detailLines.push(`• ${item.courseName} [${item.courseId}]: NRC ${item.nrc} (${item.sectionName})`);
            pureNrcs.push(item.nrc);
          }
        });

        const fullText = `HORARIO SELECCIONADO - ${currentCareer.name.toUpperCase()} (NRCs para inscripción):\nNRCs: ${pureNrcs.join(', ')}\n\nDetalle:\n${detailLines.join('\n')}`;

        navigator.clipboard.writeText(fullText).then(() => {
          setCopiedNotification(true);
          setTimeout(() => setCopiedNotification(false), 2500);
        });
      };

      const { startHour, endHour, hasSaturday, hasSunday } = useMemo(() => {
        let minH = 7;
        let maxH = 19;
        let sat = false;
        let sun = false;

        currentCombination.forEach(item => {
          item.schedule.forEach(slot => {
            if (slot.day === 'SAB') sat = true;
            if (slot.day === 'DOM') sun = true;
            const sDec = timeToDec(slot.start);
            const eDec = timeToDec(slot.end);
            if (sDec < minH) minH = Math.floor(sDec);
            if (eDec > maxH) maxH = Math.ceil(eDec);
          });
        });

        return { startHour: minH, endHour: maxH, hasSaturday: sat, hasSunday: sun };
      }, [currentCombination]);

      const activeDays = useMemo(() => {
        return DAYS.filter(d => {
          if (d.key === 'SAB' && !hasSaturday) return false;
          if (d.key === 'DOM' && !hasSunday) return false;
          return true;
        });
      }, [hasSaturday, hasSunday]);

      const totalHours = Math.max(1, endHour - startHour);

      const combinationStats = useMemo(() => {
        if (!currentCombination.length) return null;
        const daysWithClasses = new Set();
        let earliest = 24;
        let latest = 0;
        let virtualCount = 0;

        currentCombination.forEach(c => {
          if (c.isVirtual) {
            virtualCount++;
            return;
          }
          c.schedule.forEach(s => {
            daysWithClasses.add(s.day);
            const sDec = timeToDec(s.start);
            const eDec = timeToDec(s.end);
            if (sDec < earliest) earliest = sDec;
            if (eDec > latest) latest = eDec;
          });
        });

        const totalPresentialDays = hasSaturday ? 6 : 5;
        const freeDaysCount = Math.max(0, totalPresentialDays - daysWithClasses.size);

        return {
          daysCount: daysWithClasses.size,
          freeDaysCount,
          virtualCount,
          earliest: earliest < 24 ? decToTime(earliest) : '--:--',
          latest: latest > 0 ? decToTime(latest) : '--:--',
          coursesCount: currentCombination.length
        };
      }, [currentCombination, hasSaturday]);

      // =========================================================================
      // PANTALLA INICIAL DE SELECCIÓN DE CARRERA (ANTES DE DESPLEGAR NADA)
      // =========================================================================
      if (!activeCareerId) {
        return (
          <div className="min-h-screen w-full bg-[#0b0f19] flex flex-col items-center justify-center p-6 text-slate-100 font-sans relative overflow-hidden">
            {/* Luces de fondo decorativas */}
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none" />
            <div className="absolute -bottom-40 -right-40 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none" />

            <div className="max-w-xl w-full text-center space-y-8 z-10">
              {/* Encabezado */}
              <div className="space-y-3">
                <div className="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs font-semibold text-indigo-400 shadow-sm">
                  <span>⚡</span> UCAB • Universidad Católica Andrés Bello
                </div>
                <h1 className="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">
                  Generador de Horarios
                </h1>
                <p className="text-sm text-slate-400 max-w-md mx-auto leading-relaxed">
                  Bienvenido. Para comenzar a planificar y calcular tus combinaciones de materias sin choques, selecciona tu carrera:
                </p>
              </div>

              {/* Tarjetas de Selección de Carrera */}
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                
                {/* Opción 1: Ingeniería Informática */}
                <div
                  onClick={() => selectCareer('informatica')}
                  className="group p-6 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-indigo-500/80 hover:bg-slate-900/90 transition-all duration-200 cursor-pointer text-left space-y-4 shadow-xl hover:shadow-indigo-600/10 hover:-translate-y-1"
                >
                  <div className="flex items-center justify-between">
                    <span className="text-4xl p-3 rounded-2xl bg-indigo-600/10 border border-indigo-500/20 group-hover:scale-110 transition">
                      💻
                    </span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-indigo-500/20 text-indigo-300 border border-indigo-500/30">
                      8 Semestres
                    </span>
                  </div>

                  <div>
                    <h3 className="text-lg font-bold text-white group-hover:text-indigo-300 transition">
                      Ingeniería Informática
                    </h3>
                    <p className="text-xs text-slate-400 mt-1">
                      Facultad de Ingeniería • Pensum Oficial
                    </p>
                  </div>

                  <button className="w-full py-2.5 px-4 rounded-xl bg-indigo-600 group-hover:bg-indigo-500 text-white font-bold text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/20">
                    <span>Planificar Informática</span>
                    <span>→</span>
                  </button>
                </div>

                {/* Opción 2: Psicología */}
                <div
                  onClick={() => selectCareer('psicologia')}
                  className="group p-6 rounded-2xl bg-slate-900/60 border border-slate-800 hover:border-purple-500/80 hover:bg-slate-900/90 transition-all duration-200 cursor-pointer text-left space-y-4 shadow-xl hover:shadow-purple-600/10 hover:-translate-y-1"
                >
                  <div className="flex items-center justify-between">
                    <span className="text-4xl p-3 rounded-2xl bg-purple-600/10 border border-purple-500/20 group-hover:scale-110 transition">
                      🧠
                    </span>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-purple-500/20 text-purple-300 border border-purple-500/30">
                      8 Semestres
                    </span>
                  </div>

                  <div>
                    <h3 className="text-lg font-bold text-white group-hover:text-purple-300 transition">
                      Psicología
                    </h3>
                    <p className="text-xs text-slate-400 mt-1">
                      Facultad de Humanidades • Pensum Oficial
                    </p>
                  </div>

                  <button className="w-full py-2.5 px-4 rounded-xl bg-purple-600 group-hover:bg-purple-500 text-white font-bold text-xs transition flex items-center justify-center gap-2 shadow-lg shadow-purple-600/20">
                    <span>Planificar Psicología</span>
                    <span>→</span>
                  </button>
                </div>

              </div>

              {/* Pie de pantalla inicial */}
              <p className="text-[11px] text-slate-500">
                Podrás alternar entre carreras en cualquier momento sin perder los datos cargados de ninguna.
              </p>
            </div>
          </div>
        );
      }

      // =========================================================================
      // PANTALLA PRINCIPAL DE LA APLICACIÓN (UNA VEZ SELECCIONADA LA CARRERA)
      // =========================================================================
      return (
        <div className="flex h-screen w-full overflow-hidden bg-[#0b0f19] font-sans text-slate-100">
          
          {/* BARRA LATERAL PRINCIPAL */}
          <aside className="no-print w-[500px] flex-shrink-0 border-r border-slate-800/80 flex flex-col bg-[#0f172a]/95 backdrop-blur-xl z-20">
            
            {/* Header con botón para Cambiar de Carrera */}
            <div className="p-4 border-b border-slate-800/80 space-y-3">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <span className="text-2xl p-1.5 rounded-xl bg-slate-900 border border-slate-800">
                    {currentCareer.icon}
                  </span>
                  <div>
                    <div className="flex items-center gap-2">
                      <h2 className="text-sm font-bold text-white tracking-tight">
                        {currentCareer.name}
                      </h2>
                    </div>
                    <p className="text-[10px] text-slate-400">
                      {currentCareer.faculty}
                    </p>
                  </div>
                </div>

                <div className="flex items-center gap-1.5">
                  <button
                    onClick={resetAllData}
                    title="Limpiar todas las materias y NRCs de esta carrera"
                    className="text-[11px] px-2.5 py-1 rounded-md bg-rose-950/50 border border-rose-500/40 text-rose-300 hover:text-white hover:bg-rose-600 transition font-medium flex items-center gap-1"
                  >
                    <span>Limpiar</span>
                    <span>🗑️</span>
                  </button>
                  <button
                    onClick={() => setActiveCareerId(null)}
                    title="Volver a la pantalla de selección de carrera"
                    className="text-[11px] px-2 py-1 rounded-md bg-slate-800 border border-slate-700 text-slate-300 hover:text-white hover:bg-slate-700 transition"
                  >
                    Cambiar Carrera 🔄
                  </button>
                </div>
              </div>
            </div>

            {/* PESTAÑAS DEL FLUJO */}
            <div className="px-4 pt-3 pb-2 border-b border-slate-800/60 bg-slate-900/40">
              <div className="grid grid-cols-3 gap-1.5 p-1 bg-slate-950/70 border border-slate-800 rounded-xl">
                <button
                  onClick={() => setActiveTab('courses')}
                  className={`flex flex-col items-center py-2 px-1 rounded-lg text-xs font-semibold transition ${
                    activeTab === 'courses'
                      ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <span className="text-[10px] uppercase opacity-75">Paso 1</span>
                  <span className="truncate w-full text-center">Materias ({selectedCourses.length})</span>
                </button>

                <button
                  onClick={() => setActiveTab('nrcs')}
                  className={`flex flex-col items-center py-2 px-1 rounded-lg text-xs font-semibold transition ${
                    activeTab === 'nrcs'
                      ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/20'
                      : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/50'
                  }`}
                >
                  <span className="text-[10px] uppercase opacity-75">Paso 2</span>
                  <span className="truncate w-full text-center">NRCs & Horarios</span>
                </button>

                <button

                        {currentCombination.map(item => {
                          if (item.type === 'theory_practice') {
                            const theorySlots = (item.theorySchedule || []).filter(s => s.day === day.key);
                            const practiceSlots = (item.practiceSchedule || []).filter(s => s.day === day.key);

                            const renderSlot = (slot, subType, nrcVal, secName, profVal) => {
                              const sDec = timeToDec(slot.start);
                              const eDec = timeToDec(slot.end);
                              const topPercent = ((sDec - startHour) / totalHours) * 100;
                              const heightPercent = ((eDec - sDec) / totalHours) * 100;

                              return (
                                <div
                                  key={`${item.courseId}-${subType}-${slot.day}-${slot.start}`}
                                  style={{
                                    top: `${Math.max(0, topPercent)}%`,
                                    height: `${Math.max(4, heightPercent)}%`
                                  }}
                                  className={`absolute inset-x-1.5 rounded-xl p-2.5 text-white border shadow-lg flex flex-col justify-between overflow-hidden transition-all duration-200 hover:scale-[1.01] hover:z-10 ${item.color.bg} ${item.color.border}`}
                                >
                                  <div>
                                    <div className="flex items-start justify-between gap-1">
                                      <p className="font-bold text-xs leading-tight break-words drop-shadow-sm">
                                        {item.courseName} <span className="opacity-80">[{subType}]</span>
                                      </p>
                                      <span className="font-mono text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-black/40 text-white/95 border border-white/20 whitespace-nowrap">
                                        NRC {nrcVal}
                                      </span>
                                    </div>
                                    <p className="text-[10px] font-mono text-white/80 mt-0.5">
                                      {item.courseId} • {secName}
                                    </p>
                                  </div>

                                  <div className="flex items-center justify-between text-[10px] font-mono text-white/90 pt-1 border-t border-white/10 mt-1">
                                    <span>{slot.start} - {slot.end}</span>
                                    {profVal && (
                                      <span className="truncate max-w-[110px] font-sans opacity-90" title={profVal}>
                                        {profVal}
                                      </span>
                                    )}
                                  </div>
                                </div>
                              );
                            };

                            return (
                              <React.Fragment key={item.courseId}>
                                {theorySlots.map(s => renderSlot(s, 'Teoría', item.theoryNrc, item.theorySectionName, item.theoryProf))}
                                {practiceSlots.map(s => renderSlot(s, 'Práctica', item.practiceNrc, item.practiceSectionName, item.practiceProf))}
                              </React.Fragment>
                            );
                          }

                          if (item.type === 'virtual') {
                            if (day.key !== 'DOM') return null;
                            const slot = item.schedule[0];
                            if (!slot) return null;

                            const sDec = timeToDec(slot.start);
                            const eDec = timeToDec(slot.end);
                            const topPercent = ((sDec - startHour) / totalHours) * 100;
                            const heightPercent = ((eDec - sDec) / totalHours) * 100;

                            return (
                              <div
                                key={item.courseId}
                                style={{
                                  top: `${Math.max(0, topPercent)}%`,
                                  height: `${Math.max(4, heightPercent)}%`
                                }}
                                className="absolute inset-x-1.5 rounded-xl p-2.5 text-white border border-emerald-400 bg-emerald-800/90 shadow-lg flex flex-col justify-between overflow-hidden transition-all duration-200 hover:scale-[1.01] hover:z-10"
                              >
                                <div>
                                  <div className="flex items-start justify-between gap-1">
                                    <p className="font-bold text-xs leading-tight break-words">
                                      {item.courseName}
                                    </p>
                                    <span className="font-mono text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-black/40 text-emerald-200 border border-emerald-300/30 whitespace-nowrap">
                                      NRC {item.nrc}
                                    </span>
                                  </div>
                                  <p className="text-[10px] font-mono text-emerald-200 mt-0.5 flex items-center gap-1">
                                    <span>🌐 Asíncrona / Virtual</span> • {item.sectionName}
                                  </p>
                                </div>

                                <div className="flex items-center justify-between text-[10px] font-mono text-emerald-100 pt-1 border-t border-emerald-500/30 mt-1">
                                  <span>{slot.start} - {slot.end}</span>
                                  <span className="font-sans text-[9px] bg-emerald-950/60 px-1 py-0.5 rounded">
                                    Horario libre
                                  </span>
                                </div>
                              </div>
                            );
                          }

                          return (item.schedule || [])
                            .filter(s => s.day === day.key)
                            .map((slot, sIdx) => {
                              const sDec = timeToDec(slot.start);
                              const eDec = timeToDec(slot.end);
                              const topPercent = ((sDec - startHour) / totalHours) * 100;
                              const heightPercent = ((eDec - sDec) / totalHours) * 100;

                              return (
                                <div
                                  key={`${item.courseId}-${sIdx}`}
                                  style={{
                                    top: `${Math.max(0, topPercent)}%`,
                                    height: `${Math.max(4, heightPercent)}%`
                                  }}
                                  className={`absolute inset-x-1.5 rounded-xl p-2.5 text-white border shadow-lg flex flex-col justify-between overflow-hidden transition-all duration-200 hover:scale-[1.01] hover:z-10 ${item.color.bg} ${item.color.border}`}
                                >
                                  <div>
                                    <div className="flex items-start justify-between gap-1">
                                      <p className="font-bold text-xs leading-tight break-words drop-shadow-sm">
                                        {item.courseName}
                                      </p>
                                      <span className="font-mono text-[10px] font-extrabold px-1.5 py-0.5 rounded bg-black/40 text-white/95 border border-white/20 whitespace-nowrap">
                                        NRC {item.nrc}
                                      </span>
                                    </div>
                                    <p className="text-[10px] font-mono text-white/80 mt-0.5">
                                      {item.courseId} • {item.sectionName}
                                    </p>
                                  </div>

                                  <div className="flex items-center justify-between text-[10px] font-mono text-white/90 pt-1 border-t border-white/10 mt-1">
                                    <span>{slot.start} - {slot.end}</span>
                                    {item.prof && (
                                      <span className="truncate max-w-[110px] font-sans opacity-90" title={item.prof}>
                                        {item.prof}
                                      </span>
                                    )}
                                  </div>
                                </div>
                              );
                            });
                        })}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
